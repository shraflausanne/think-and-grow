<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1424">
<meta name="apple-mobile-web-app-title" content="Think and Grow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Think &amp; Grow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm, confident personal coach; warm, never shouty.
   IDEA: a pocket commitment ledger: one signed contract plus a daily ritual card.
   PICTURE: the step card, progress ring and paper contract carry each screen.
   COLOUR and TYPE: night navy ground, gold for progress, coral for weak spots; Bricolage display, Inter body, Caveat signature.
   LAYOUT: phone-first single column, fixed tab bar, centred at 480px on wider screens. */
:root{color-scheme:dark;--bg:#0B1424;--s1:#121E33;--s2:#182844;--s3:#1C2B45;--line:#22355A;--line2:#2A3E63;--ink:#F5F1E8;--mut:#A3B1C8;--faint:#7F8DA6;--soft:#C9D3E3;--gold:#F2C14E;--coral:#FF8A65;--paper:#F5F1E8;--pink:#1B2333;--brown:#7A5710}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.disp{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;letter-spacing:-.02em}
header{padding:20px 16px 14px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-size:16px}
.logo{width:32px;height:32px;border-radius:12px;background:var(--gold);display:grid;place-items:center}
.status{font-size:12px;font-weight:600;padding:7px 12px;border-radius:99px;background:var(--s2);color:var(--soft);display:flex;align-items:center;gap:7px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status.ok i{background:#5CC8B0}.status.busy i{background:var(--gold)}.status.bad i{background:var(--coral)}
.kick{font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--gold)}
h1{margin:4px 0 0;font-size:clamp(28px,8vw,34px);line-height:1.05;text-wrap:balance}
main{flex:1;padding:4px 16px calc(110px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.paper{background:var(--paper);color:var(--pink);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:12px}
.paper .lab{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--brown)}
.stmt{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:18px;line-height:1.45;white-space:pre-line}
.mut{color:var(--mut)}.small{font-size:13px;line-height:1.4}
.fld{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:12px;color:var(--ink);font:16px/1.45 Inter,sans-serif;padding:14px 16px;min-height:52px}
.fld::placeholder{color:var(--faint)}textarea.fld{resize:none;min-height:128px;field-sizing:content}textarea.fld.short{min-height:0}
label.l{font-size:13px;font-weight:600;color:var(--mut)}
.field{display:flex;flex-direction:column;gap:8px}
.segs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.seg{height:44px;border:0;padding:0;background:none;display:flex;align-items:center}.seg span{display:block;width:100%;height:5px;border-radius:99px;background:var(--line)}.seg.on span{background:var(--gold)}
.num{font-size:64px;line-height:.85;letter-spacing:-.04em;color:var(--gold)}
.stephead{display:flex;align-items:flex-end;justify-content:space-between}
.steptag{font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--mut);text-align:right}
h2{margin:0;font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;letter-spacing:-.02em;font-size:24px;line-height:1.15;text-wrap:balance}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--s2);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45;color:var(--soft)}
.tip svg{flex:none;margin-top:2px}
.navrow{display:flex;gap:10px}
.btn{min-height:56px;border-radius:18px;border:0;background:var(--gold);color:var(--bg);font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;flex:1;font-size:16px}
.ghost{width:56px;flex:none;background:transparent;border:1px solid var(--line2);color:var(--ink)}
.sig{width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--pink);color:var(--pink);font:600 32px/1.1 Caveat,cursive;padding:4px 2px;min-height:48px}
.sig::placeholder{color:#6E685C}.sig:focus-visible{outline-color:var(--brown)}
.seal{width:40px;height:40px;border-radius:50%;background:transparent;border:2px dashed #7A5710;display:grid;place-items:center;transition:background .3s}.seal svg{opacity:.35}.seal.on{background:var(--gold);border:2px solid var(--gold)}.seal.on svg{opacity:1}
.big{font-size:40px;color:var(--gold)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--s2);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}
.hero{flex-direction:row;align-items:center;gap:18px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring circle{transition:stroke-dasharray .5s ease}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.week span{font-size:11px;font-weight:600;color:var(--faint)}.week .today span{color:var(--ink)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #3A4F75;margin:5px auto 0}.today .dot{border-color:var(--ink)}.full .dot{background:var(--gold);border-color:var(--gold)}
.banner{background:var(--gold);color:var(--bg);border-radius:18px;padding:16px 18px;display:flex;gap:12px;align-items:center}
.rit{min-height:68px;border-radius:18px;border:1px solid var(--line);background:var(--s1);padding:12px 16px;display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.rit.on{background:var(--s3);border-color:var(--gold)}
.chk{width:30px;height:30px;border-radius:50%;flex:none;border:2px solid #3A4F75;display:grid;place-items:center}
.chk svg{stroke:transparent}.rit.on .chk{background:var(--gold);border-color:var(--gold)}.rit.on .chk svg{stroke:var(--bg)}
.when{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--gold)}
.list{display:flex;flex-direction:column;gap:10px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
.focus{background:var(--s2);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px}
.prin{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px 16px 6px;display:flex;flex-direction:column;gap:6px}
.prin.weak{border-color:var(--coral)}
.pn{width:34px;height:34px;flex:none;border-radius:12px;background:var(--s2);display:grid;place-items:center;font-size:15px;color:var(--gold)}
.meter{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding-left:46px}
.meter button{height:44px;border:0;padding:0;background:none;display:flex;align-items:center}
.meter span{display:block;width:100%;height:10px;border-radius:99px;background:#24375A}.meter .on span{background:var(--gold)}
.av{width:36px;height:36px;border-radius:50%;color:var(--bg);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.stack .av{width:34px;height:34px;border:2px solid var(--s1);font-size:11px}.stack .av+.av{margin-left:-8px}.stack .more{background:var(--s2);color:var(--soft)}
.mem{display:flex;align-items:center;gap:12px;min-height:48px}
.x{width:44px;height:44px;border:0;border-radius:12px;background:none;color:var(--mut);display:grid;place-items:center}
.add{display:flex;gap:8px}.add .btn{width:52px;flex:none;min-height:52px;border-radius:12px}
.fear{min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:var(--soft);font-weight:600;font-size:14px;text-align:left;padding:10px 14px}
.fear.on{background:#3A2220;border-color:var(--coral);color:#FFB49C}
.pc{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.foot{margin:0;font-size:12px;line-height:1.4;color:var(--faint);text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
nav{position:fixed;left:0;right:0;bottom:0;background:#0E192C;border-top:1px solid #1C2C48;padding:8px max(10px,calc(50vw - 270px)) calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;z-index:5}
nav button{min-height:58px;border:0;border-radius:18px;background:none;color:#8D9BB4;font-weight:600;font-size:11.5px;padding:0 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
nav button[aria-current=page]{background:#1A2942;color:var(--gold)}
.lhero{background:var(--gold);color:var(--bg);border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.lhero p{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:21px;line-height:1.35}
.lbody{margin:0;font-size:15px;line-height:1.55;color:var(--soft)}
.loop{display:flex;flex-direction:column}
.lstep{display:flex;gap:14px;position:relative;padding-bottom:16px}
.lstep:not(:last-child)::before{content:"";position:absolute;left:17px;top:36px;bottom:0;width:2px;background:var(--line2)}
.lnum{width:36px;height:36px;border-radius:50%;flex:none;background:var(--s2);border:2px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-size:15px}
.lback{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--gold);font-weight:600;padding-left:4px}
.lmap{display:flex;flex-direction:column;gap:10px}
.lgo{display:flex;gap:14px;align-items:center;text-align:left;width:100%;min-height:72px;border-radius:18px;border:1px solid var(--line);background:var(--s2);padding:14px 16px}
.lgo .ic{width:40px;height:40px;border-radius:12px;background:var(--bg);color:var(--gold);display:grid;place-items:center;flex:none}
.sci{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--s2)}
.sci.warn{background:#2A1F22;border:1px solid #6B3A30}
.tag{font-size:11px;font-weight:700;letter-spacing:.14em}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 32px),transparent)}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--line2);background:transparent;color:var(--soft);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--gold);color:var(--bg);border-color:var(--gold)}.chip.done:not(.on){color:#5CC8B0;border-color:#2E5F58}
.formula{display:flex;flex-direction:column;gap:6px}
.fx{display:flex;gap:12px;align-items:center;background:var(--s2);border-radius:12px;padding:12px 14px}
.fxn{width:32px;height:32px;border-radius:12px;background:var(--gold);color:var(--bg);display:grid;place-items:center;flex:none}
.plus{text-align:center;font:800 20px/1 'Bricolage Grotesque',sans-serif;color:var(--gold)}
.fres{background:var(--gold);color:var(--bg);border-radius:12px;padding:14px;text-align:center;font-size:22px}
.wa{display:flex;flex-direction:column;gap:4px}
.wish{background:#2A1F22;border:1px solid #6B3A30;border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;color:#FFB49C}
.aimc{background:var(--gold);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;font-weight:600}
.arrow{text-align:center;color:var(--mut);font-weight:700}
.tests{display:grid;grid-template-columns:1fr;gap:8px}
.tst{background:var(--s2);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:14px}
.maya{margin-top:6px;background:var(--s2);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;color:var(--soft)}
.story{background:var(--s2)}
.dayline{display:flex;flex-direction:column}
.dl{display:flex;gap:14px;padding-bottom:16px;position:relative}
.dl:not(:last-child)::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line2)}
.dlic{width:44px;height:44px;border-radius:50%;background:var(--s2);color:var(--gold);display:grid;place-items:center;flex:none}
.tipr{display:flex;gap:10px;align-items:flex-start}.tipr>*:first-child{flex:none}
.woop{display:flex;flex-direction:column;gap:8px}
.wp{display:flex;gap:12px;align-items:flex-start;background:var(--s2);border-radius:12px;padding:12px}
.wk{width:36px;height:36px;border-radius:12px;background:var(--gold);color:var(--bg);display:grid;place-items:center;flex:none;font-size:18px}
.clusters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cl{border:1.5px solid;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--s2)}
.chipw{display:flex;flex-wrap:wrap;gap:4px}
.pchip{color:var(--bg);font-size:11.5px;font-weight:600;border-radius:8px;padding:3px 7px}
.pd{background:var(--s1);border:1px solid var(--line);border-radius:18px}
.pd summary{list-style:none;display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:56px;cursor:pointer}
.pd summary::-webkit-details-marker{display:none}
.chev{transition:transform .2s}.pd[open] .chev{transform:rotate(180deg)}
.pdb{padding:12px 16px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.tryit{background:var(--gold);color:var(--bg);border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:2px}
.chain{display:flex;align-items:center;gap:6px}
.ch{flex:1;text-align:center;background:var(--coral);color:var(--bg);font-weight:700;border-radius:12px;padding:12px 4px;font-size:14px}
.fs{background:var(--s2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.mm{position:relative;height:260px}
.mm::before{content:"";position:absolute;left:50%;top:50%;width:170px;height:170px;transform:translate(-50%,-50%);border:2px dashed var(--line2);border-radius:50%}
.mmc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:var(--gold);color:var(--bg);display:grid;place-items:center;font-size:18px}
.mmr{position:absolute;width:96px;min-height:68px;text-align:center;border-radius:12px;padding:8px 6px;color:var(--bg);display:flex;flex-direction:column;justify-content:center}
.mm0{left:50%;top:0;transform:translateX(-50%);background:#5CC8B0}.mm1{right:0;top:50%;transform:translateY(-50%);background:#A99BFF}
.mm2{left:50%;bottom:0;transform:translateX(-50%);background:#6FB7FF}.mm3{left:0;top:50%;transform:translateY(-50%);background:#FF8A65}
.kq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kqi{background:#173A36;color:#C6EFE6;border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.35;margin-top:6px}
.kqi.q{background:#3A2220;color:#FFB49C}
.qo{min-height:52px;border-radius:12px;border:1px solid var(--line2);background:var(--s2);text-align:left;padding:10px 14px;font-size:15px}
.qo.right{border-color:#5CC8B0;background:#173A36}.qo.wrong{border-color:var(--coral);background:#3A2220}
.qwhy{background:var(--s2);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45;color:var(--soft)}
.pop{animation:pop .35s ease}@keyframes pop{0%{transform:scale(.96);opacity:.6}100%{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="top">
<div class="brand disp"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1424" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 20 4 15 9 15 9 10 14 10 14 5 20 5"/></svg></span>Think &amp; Grow</div>
<div id="status" class="status" role="status" aria-live="polite"><i></i><span>Loading</span></div>
</div>
<div><div id="kick" class="kick"></div><h1 id="title" class="disp"></h1></div>
</header>
<main id="main"></main>
<nav aria-label="Sections">
<button data-act="tab" data-tab="learn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5h6a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2zM22 5h-6a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h7z"/></svg>Learn</button>
<button data-act="tab" data-tab="aim"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>Aim</button>
<button data-act="tab" data-tab="daily"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Daily</button>
<button data-act="tab" data-tab="steps"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 20 4 15 9 15 9 10 14 10 14 5 20 5"/></svg>13 Steps</button>
<button data-act="tab" data-tab="mind"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.5c2.6.3 4.5 2.5 4.5 5.5"/></svg>Mind</button>
</nav>
</div>
<script>
{
/* =====================================================================
   EDITABLE CONTENT: change any wording here and the screens update.
   ===================================================================== */
const SCREENS = {
  learn: { kicker: 'THE IDEA BEHIND THE APP', title: 'Think and Grow Rich, in plain words' },
  aim:   { kicker: 'DEFINITE CHIEF AIM',   title: 'Turn a wish into a commitment' },
  daily: { kicker: 'TODAY',                title: 'Keep the goal in front of you' },
  steps: { kicker: 'THE 13 PRINCIPLES',    title: 'Find your weakest link' },
  mind:  { kicker: 'ALLIES AND OBSTACLES', title: 'Who and what shapes your mind' }
};
const AIM_STEPS = [
  { tag: 'DESIRE',    q: 'What exactly do you want?',      tip: 'Be precise. “More money” is a wish. A specific, measurable result is a goal.' },
  { tag: 'EXCHANGE',  q: 'What will you give in return?',  tip: 'Nothing comes for nothing. Name the effort, skill or service you will trade for it.' },
  { tag: 'DEADLINE',  q: 'By when will you have it?',      tip: 'A definite date turns an intention into a commitment.' },
  { tag: 'PLAN',      q: 'How will you get there?',        tip: 'Write a plan and start today, ready or not. If it fails, change the plan, not the goal.' },
  { tag: 'STATEMENT', q: 'Put it in writing and sign it.', tip: 'Your answers become one clear statement. Signing it makes it yours.' },
  { tag: 'RITUAL',    q: 'Read it aloud, twice a day.',    tip: 'Once on waking, once before sleep. See and feel the goal as already reached.' }
];
const NEXT_LABELS = ['Next', 'Next', 'Next', 'Write my statement', 'Sign and continue', 'Start today’s ritual'];
const RITUALS = [

    + '<section class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><div class="disp" style="font-size:20px">The six fears</div><div class="small" style="color:' + (fc ? 'var(--coral)' : 'var(--mut)') + ';font-weight:600">' + fc + ' to work on</div></div><div class="small mut">Tap the ones holding you back right now.</div>'
    + '<div class="two" style="gap:8px">' + FEARS.map(f => '<button class="fear' + (S.fears[f.id] ? ' on' : '') + '" data-act="fear" data-id="' + f.id + '" aria-pressed="' + !!S.fears[f.id] + '">' + esc(f.label) + '</button>').join('') + '</div></section>'
    + '<div class="disp" style="font-size:20px;padding:6px 2px 0">Four habits of persistence</div>'
    + '<div class="two">' + PERSISTENCE.map((h, i) => '<div class="pc"><div class="disp" style="font-size:28px;line-height:1;color:var(--gold)">' + (i + 1) + '</div><div style="font-weight:600">' + esc(h.title) + '</div><div class="small mut">' + esc(h.text) + '</div></div>').join('') + '</div>'
    + '<p class="foot">Frameworks paraphrased from Napoleon Hill, Think and Grow Rich (1937).</p>';
}

/* ---------- render ---------- */
function render(scrollTop) {
  ensureToday();
  const h = new Date().getHours();
  document.getElementById('kick').textContent = tab === 'daily' ? (h < 12 ? 'GOOD MORNING' : h < 18 ? 'GOOD AFTERNOON' : 'GOOD EVENING') : SCREENS[tab].kicker;
  document.getElementById('title').textContent = SCREENS[tab].title;
  main.innerHTML = tab === 'learn' ? learnHTML() : tab === 'aim' ? aimHTML() : tab === 'daily' ? dailyHTML() : tab === 'steps' ? stepsHTML() : mindHTML();
  document.querySelectorAll('nav button').forEach(b => b.dataset.tab === tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  const chip = main.querySelector('.chip.on'); if (chip) { const cp = chip.parentElement; cp.scrollLeft = chip.offsetLeft - cp.offsetLeft - (cp.clientWidth - chip.offsetWidth) / 2; }
  if (scrollTop) window.scrollTo(0, 0);
}
function liveUpdate() {
  const s = main.querySelector('[data-live=stmt]'); if (s) s.textContent = statement();
  const d = main.querySelector('[data-live=days]'); if (d) d.innerHTML = daysHTML();
  const seal = main.querySelector('[data-live=seal]'); if (seal) seal.classList.toggle('on', !!S.name.trim());
  const sg = main.querySelector('[data-live=signed]'); if (sg) sg.textContent = S.signedOn ? 'Signed on ' + S.signedOn : '';
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'tab') { tab = b.dataset.tab; userNav = true; render(true); return; }
  if (a === 'lch') { lch = +b.dataset.i; render(true); return; }
  if (a === 'lprev') { lch = Math.max(0, lch - 1); render(true); return; }
  if (a === 'lnext') { S.learnDone = { ...S.learnDone, [lch]: true }; if (lch < LEARN.chapters.length - 1) lch++; else { tab = 'aim'; userNav = true; } save(); render(true); return; }
  if (a === 'quiz') { quiz[b.dataset.ch] = +b.dataset.o; render(); return; }
  if (a === 'seg') { S.aimStep = +b.dataset.i; }
  if (a === 'back') { S.aimStep = Math.max(0, S.aimStep - 1); }
  if (a === 'next') { if (S.aimStep < 5) S.aimStep++; else { tab = 'daily'; save(); render(true); return; } }
  if (a === 'rit') {
    S.daily = { ...S.daily, [b.dataset.id]: !S.daily[b.dataset.id] }; S.dailyDate = todayKey();
    const h = { ...S.history };
    if (RITUALS.every(r => S.daily[r.id])) h[todayKey()] = true; else delete h[todayKey()];
    S.history = h;
  }
  if (a === 'rate') S.ratings = { ...S.ratings, [b.dataset.id]: +b.dataset.v };
  if (a === 'fear') S.fears = { ...S.fears, [b.dataset.id]: !S.fears[b.dataset.id] };
  if (a === 'rm') S.members = S.members.filter((_, j) => j !== +b.dataset.i);
  save(); render(['seg', 'back', 'next'].includes(a));
});
document.addEventListener('input', e => {
  const f = e.target.dataset && e.target.dataset.field; if (!f) return;
  S[f] = e.target.value;
  if (e.target.tagName === 'TEXTAREA' && !CSS.supports('field-sizing', 'content')) { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; }
  if (f === 'name') S.signedOn = S.name.trim() ? (S.signedOn || fmt(new Date(), { day: 'numeric', month: 'long', year: 'numeric' })) : '';
  liveUpdate(); save();
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'addForm') return;
  e.preventDefault();
  const inp = document.getElementById('f-new'), n = inp.value.trim();
  if (!n) return;
  S.members = [...S.members, n.slice(0, 60)]; save(); render();
  document.getElementById('f-new').focus();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && tab === 'daily') render(); });

/* ---------- start ---------- */
render();
(async () => {
  const readLocal = () => { try { const r = localStorage.getItem(LOCAL_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } };
  const useLocal = () => { const l = readLocal(); if (l) apply(l); ref = null; loaded = true; setStatus('local'); if (!userNav && S.goal) tab = 'daily'; render(); };
  if (!window.claude || !window.claude.use) { useLocal(); return; }
  const slow = setTimeout(() => { if (!loaded) setStatus('slow'); }, 10000);
  try {
    const [user, db] = await Promise.all([claude.use('user'), claude.use('db')]);
    const id = user ? await user.id() : null;
    if (!db || !id) { clearTimeout(slow); useLocal(); return; }
    ref = db.doc('data/users/' + id + '/tgr');
    const snap = await ref.get();
    clearTimeout(slow);
    if (snap.exists) apply(snap.data());
    else { const l = readLocal(); if (l) apply(l); }
    loaded = true; setStatus('saved'); if (!userNav && S.goal) tab = 'daily'; render();
    if (!snap.exists && readLocal()) save();
  } catch (e) { clearTimeout(slow); useLocal(); setStatus('error'); }
})();
}
</script>
</body>
</html>
